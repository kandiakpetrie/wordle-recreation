<html>
    <head>
        <title>Wordle</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, inital-scale =1, user-scalable=no">
        <link rel="stylesheet" href="wordle.css">
        <script src="wordle.js"></script>
    </head>
    <body>
        <div id="game">
            <h1 id="title">Wordle</h1>
            <hr>
            <div id="stats">
                <div class="stat"><span id="wins">0</span><label>Wins</label></div>
                <div class="stat"><span id="losses">0</span><label>Losses</label></div>
                <div class="stat"><span id="streak">0</span><label>Streak</label></div>
            </div>
            <br>
            <div id="message"></div>
            <div id="board">
            </div>

            <br>
            <h1 id="answer"></h1>
            <button id="replay" onclick="resetGame()">Play Again</button>
        </div>
        
    </body>
</html>
